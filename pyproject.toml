[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libtv-team"
version = "0.5.0"
description = "团队 liblib 账号统一管理面板：账号池、成员额度、算力均摊、告警通知与对外 API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
libtv-team = "liblib2api.cli:main"
liblib2api = "liblib2api.cli:main"

[tool.setuptools.packages.find]
include = ["liblib2api*"]
